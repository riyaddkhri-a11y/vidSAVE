name: VidSave Release CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Manual versionName override (e.g., 1.1.0)'
        required: false
        default: ''
      version_code_override:
        description: 'Manual versionCode override (e.g., 2)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build Signed Release APK & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Restore Persistent Keystore & Validate Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== Auditing & Restoring Persistent Release Keystore ==="

          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Missing required secret 'STORE_PASSWORD'. Please configure STORE_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing required secret 'KEY_ALIAS'. Please configure KEY_ALIAS in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required secret 'KEY_PASSWORD'. Please configure KEY_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi

          KEYSTORE_PATH="${GITHUB_WORKSPACE}/release.keystore"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring keystore from secret 'KEYSTORE_BASE64'..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          elif [ -n "$SIGNING_KEY" ]; then
            echo "Restoring keystore from secret 'SIGNING_KEY'..."
            echo "$SIGNING_KEY" | base64 -d > "$KEYSTORE_PATH"
          else
            echo "::error::Missing required signing secret. You MUST configure either 'KEYSTORE_BASE64' or 'SIGNING_KEY' (Base64-encoded JKS/keystore file) in GitHub Repository Secrets."
            exit 1
          fi

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore file is empty or corrupted. Verify KEYSTORE_BASE64 or SIGNING_KEY is a valid Base64-encoded keystore."
            exit 1
          fi

          echo "Validating restored keystore using Java keytool..."
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1
          KEYTOOL_EXIT=$?

          if [ $KEYTOOL_EXIT -ne 0 ]; then
            echo "::error::Keystore validation failed. Verify STORE_PASSWORD and KEY_ALIAS match the keystore provided in secrets."
            exit 1
          fi

          echo "Keystore successfully validated with keytool!"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

      - name: Calculate Next Application Version
        id: versioning
        run: |
          echo "=== Calculating Automatic Patch Version ==="
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          CLEAN_VERSION=${LATEST_TAG#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
          NEXT_PATCH=$((PATCH + 1))
          AUTO_VERSION_NAME="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          
          TAG_COUNT=$(git tag -l "v*" | wc -l)
          AUTO_VERSION_CODE=$((TAG_COUNT + 1))

          FINAL_VERSION_NAME="${{ github.event.inputs.version_override }}"
          if [ -z "$FINAL_VERSION_NAME" ]; then
            FINAL_VERSION_NAME="$AUTO_VERSION_NAME"
          fi

          FINAL_VERSION_CODE="${{ github.event.inputs.version_code_override }}"
          if [ -z "$FINAL_VERSION_CODE" ]; then
            FINAL_VERSION_CODE="$AUTO_VERSION_CODE"
          fi

          echo "VERSION_NAME=$FINAL_VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$FINAL_VERSION_CODE" >> $GITHUB_ENV
          echo "Calculated VersionName: $FINAL_VERSION_NAME"
          echo "Calculated VersionCode: $FINAL_VERSION_CODE"

      - name: Execute Tests and Verification
        run: |
          echo "=== Running Unit Tests ==="
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Signed Release APK
        run: |
          echo "=== Building Signed Release APK ==="
          ./gradlew assembleRelease \
            -Pandroid.injected.version.name="${{ env.VERSION_NAME }}" \
            -Pandroid.injected.version.code="${{ env.VERSION_CODE }}" \
            --no-daemon

      - name: Verify APK Integrity and Certificate
        id: verify_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK file not found."
            exit 1
          fi

          echo "Found Release APK at $APK_PATH"
          echo "APK_FILE_PATH=$APK_PATH" >> $GITHUB_ENV

          SHA256_HASH=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "APK_SHA256=$SHA256_HASH" >> $GITHUB_ENV
          echo "Release APK SHA-256: $SHA256_HASH"

      - name: Generate Machine-Readable Update Metadata JSON
        run: |
          METADATA_FILE="update-metadata.json"
          cat <<EOF > $METADATA_FILE
          {
            "version": "${{ env.VERSION_NAME }}",
            "versionCode": ${{ env.VERSION_CODE }},
            "releaseName": "VidSave v${{ env.VERSION_NAME }}",
            "releaseNotes": "Automated production release v${{ env.VERSION_NAME }} with persistent APK signing and in-app update support.",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/VidSave-v${{ env.VERSION_NAME }}-release.apk",
            "sha256": "${{ env.APK_SHA256 }}",
            "packageName": "com.vidsave.app",
            "mandatory": false
          }
          EOF
          echo "Generated update-metadata.json:"
          cat $METADATA_FILE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "VidSave v${{ env.VERSION_NAME }}"
          body: |
            ## VidSave Release v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})

            ### Release Highlights:
            - TikTok video extraction and high quality downloads.
            - ChatGPT-inspired conversational interface.
            - Full persistent APK signing.
            - Automatic in-app update integration.

            **Package Name:** `com.vidsave.app`
            **SHA-256 Checksum:** `${{ env.APK_SHA256 }}`
          draft: false
          prerelease: false
          files: |
            ${{ env.APK_FILE_PATH }}
            update-metadata.json

      - name: Produce GitHub Build Summary
        run: |
          echo "## 🚀 VidSave Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** \`com.vidsave.app\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Name:** \`v${{ env.VERSION_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code:** \`${{ env.VERSION_CODE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Status:** Published to GitHub Releases" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`${{ env.APK_SHA256 }}\`" >> $GITHUB_STEP_SUMMARY
